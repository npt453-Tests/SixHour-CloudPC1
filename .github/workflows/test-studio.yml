
      - name: Run installer and diagnose
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $file = "$env:TEMP\RobloxStudioInstaller.exe"

          Write-Host "Starting Roblox Studio installer..."

          $installer = Start-Process `
            -FilePath $file `
            -PassThru

          Write-Host "Installer PID: $($installer.Id)"

          $deadline = (Get-Date).AddMinutes(5)
          $studio = $null

          $paths = @(
            "$env:LOCALAPPDATA\Roblox",
            "$env:ProgramFiles\Roblox",
            "${env:ProgramFiles(x86)}\Roblox"
          )

          do {
            foreach ($path in $paths) {
              if (Test-Path $path) {
                $studio = Get-ChildItem `
                  -Path $path `
                  -Filter "RobloxStudioBeta.exe" `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              }
              if ($studio) { break }
            }

            if (-not $studio) {
              Start-Sleep -Seconds 5
            }

          } until ($studio -or (Get-Date) -gt $deadline)

          if ($studio) {
            Write-Host "STUDIO_INSTALLED"
            Write-Host $studio.FullName
          } else {
            Write-Host "INSTALL_NOT_DETECTED"

            if ($installer.HasExited) {
              Write-Host "Installer exit code: $($installer.ExitCode)"
            } else {
              Write-Host "Installer is still running."
            }

            Write-Host "Roblox-related processes:"
            Get-Process |
              Where-Object {
                $_.ProcessName -match "Roblox|Studio"
              } |
              Select-Object ProcessName, Id

            Write-Host "Roblox installation folders:"
            foreach ($path in $paths) {
              if (Test-Path $path) {
                Get-ChildItem $path |
                  Select-Object Name, FullName
              }
            }

            Write-Host "Recent Roblox logs:"
            $logs = "$env:LOCALAPPDATA\Roblox\logs"
            if (Test-Path $logs) {
              Get-ChildItem $logs -File |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 5 Name, Length
            }
          }
