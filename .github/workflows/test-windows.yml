
name: Test Windows Cloud Environment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check Windows version
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsArchitecture

      - name: Check available resources
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem |
            Select-Object NumberOfLogicalProcessors,
                          TotalPhysicalMemory

      - name: Check disk space
        shell: pwsh
        run: |
          Get-PSDrive C

      - name: Finish
        run: echo "Windows environment test completed!"
